name: Build MindPool Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile_app/**"
      - "backend/**"
      - ".github/workflows/build_apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]>=1.1.2"

      - name: Validate Python modules
        run: |
          python -m pip install -r backend/requirements.txt -r mobile_app/requirements.txt
          python -m compileall -q backend mobile_app
          python -c "from backend.main import app; print('Backend import OK')"
          cd mobile_app
          python -c "import main; from engine.llama_runner import LlamaRunner; from ui.farm_view import FarmController; print('Mobile modules import OK')"

      - name: Build Android APK
        working-directory: mobile_app
        run: flet build apk --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindPool-Android-APK
          path: mobile_app/build/apk/*.apk
          if-no-files-found: error
          retention-days: 14
